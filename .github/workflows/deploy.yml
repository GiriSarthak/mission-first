name: Deploy

# main is the deployment branch: a push here that passes CI is released to
# app.gdpfirst.com. Nothing else deploys.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # manual re-deploy from the Actions tab

# Never let two deploys overlap on the same server.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: typecheck · tests · build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./ci.db"
      AUTH_SECRET: "ci-only-not-a-real-secret-000000000000000="
      AUTH_TRUST_HOST: "true"
      AI_MODEL_HEAVY: "claude-opus-5"
      AI_MODEL_LIGHT: "claude-haiku-4-5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --include=dev
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: Release to app.gdpfirst.com
    needs: verify # never deploy a red build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.gdpfirst.com

    steps:
      - name: Configure deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run server deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              'bash /var/www/html/mission-first/deploy/deploy.sh'

      - name: Verify public endpoint
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 https://app.gdpfirst.com/login || echo 000)
          echo "https://app.gdpfirst.com/login -> $code"
          # 200 once DNS + certbot are in place. Don't fail the deploy on the
          # public check alone — deploy.sh already health-checked the app
          # locally on the server.
          if [ "$code" != "200" ]; then
            echo "::warning::Public endpoint returned $code (DNS/TLS may not be live yet)"
          fi
