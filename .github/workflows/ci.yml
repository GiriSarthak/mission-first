name: CI

# Runs on every push and pull request. main is protected by this workflow —
# deploy.yml only runs after CI passes on main.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    name: typecheck · tests · build
    runs-on: ubuntu-latest

    env:
      # Throwaway values so the build can resolve config; no real secrets in CI.
      DATABASE_URL: "file:./ci.db"
      AUTH_SECRET: "ci-only-not-a-real-secret-000000000000000="
      AUTH_TRUST_HOST: "true"
      AI_MODEL_HEAVY: "claude-opus-5"
      AI_MODEL_LIGHT: "claude-haiku-4-5"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the server (Ubuntu 24.04 ships Node 20).
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Prepare database schema
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
