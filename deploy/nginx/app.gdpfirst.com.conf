# Mission First — nginx site config for app.gdpfirst.com
#
# Scope: this file adds ONE new server block for app.gdpfirst.com only.
# It does not touch nginx.conf, any other site, or any shared snippet.
#
# Install:
#   sudo cp deploy/nginx/app.gdpfirst.com.conf /etc/nginx/sites-available/app.gdpfirst.com
#   sudo ln -s /etc/nginx/sites-available/app.gdpfirst.com /etc/nginx/sites-enabled/app.gdpfirst.com
#   sudo nginx -t          # MUST pass before the next line
#   sudo systemctl reload nginx
#
# Then obtain the certificate (certbot rewrites this file to add the 443 block
# and the http->https redirect, matching the pattern used by the other sites):
#   sudo certbot --nginx -d app.gdpfirst.com
#
# The app itself runs under pm2 as webserver0 on 127.0.0.1:3010.

server {
    listen 80;
    listen [::]:80;
    server_name app.gdpfirst.com;

    # Uploaded tender PDFs and the SQLite database live outside the web root
    # and are never served directly — everything goes through the Next.js app.
    client_max_body_size 32m;

    access_log /var/log/nginx/app.gdpfirst.com.access.log;
    error_log  /var/log/nginx/app.gdpfirst.com.error.log;

    # Next.js build assets are content-hashed and immutable.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        # Auth.js and Next.js server actions need the real origin; without
        # these the login callback and redirects resolve to the wrong host.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Websocket/HMR upgrade path (harmless in production).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Document extraction jobs are long-running.
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_buffering off;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
