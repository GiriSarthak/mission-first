# Mission First — pm2 process definition.
#
# Runs as the webserver0 user alongside the existing pm2 processes
# ("app", "nephro-wa-bot"). It adds a new process named mission-first and
# does not modify or restart anything already in the pm2 list.
#
# Start:   pm2 start deploy/pm2.ecosystem.yaml
# Reload:  pm2 reload mission-first        (zero-downtime)
# Persist: pm2 save                        (keeps it across reboots)
#
# NOTE: `pm2 save` rewrites the shared pm2 dump for this user, which will then
# include the already-running processes as well — that is the intended pm2
# behaviour and does not restart them.

apps:
  - name: mission-first
    cwd: /var/www/html/mission-first
    script: node_modules/next/dist/bin/next
    args: start -p 3010
    instances: 1
    exec_mode: fork
    autorestart: true
    watch: false
    max_memory_restart: 512M
    env:
      NODE_ENV: production
      PORT: "3010"
      # Everything secret (DATABASE_URL, AUTH_SECRET, ANTHROPIC_API_KEY,
      # AUTH_URL) comes from /var/www/html/mission-first/.env, which is
      # gitignored and never leaves the server.
    error_file: /var/www/html/mission-first/logs/pm2-error.log
    out_file: /var/www/html/mission-first/logs/pm2-out.log
    merge_logs: true
    time: true
